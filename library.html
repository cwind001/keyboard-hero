<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词库管理 · 键盘勇者</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand">✦ <b>词库管理</b><small>KEYBOARD HERO</small></div><a class="button-link" href="/">返回游戏</a></header>
<main class="library-main"><h1>把课本词汇变成你的关卡</h1><p>按教材与单元整理词汇。中文拼写玩法需要每个单词都有中文释义。修改词表不会改变历史对局。</p><p class="error" id="error" role="alert"></p><p id="status" role="status"></p>
<section><h3>教材</h3><form id="bookForm"><label>选择教材（选择后可编辑）<select id="bookEdit"><option value="">新建教材</option></select></label><div class="form-grid"><label>教材名称<input id="bookName" maxlength="120" required placeholder="英语"></label><label>版本<input id="edition" maxlength="120" placeholder="人教版"></label><label>年级<input id="grade" maxlength="120" placeholder="七年级"></label><label>册次<input id="volume" maxlength="120" placeholder="上册"></label></div><div class="actions"><button>保存教材</button><button type="button" id="archiveBook" hidden>归档教材及其词表</button></div></form></section>
<section><h3 id="editorTitle">新建词表</h3><form id="listForm"><div class="form-grid"><label>所属教材<select id="listBook"><option value="">独立词表</option></select></label><label>词表名称<input id="listName" maxlength="120" required placeholder="Unit 1"></label></div><label>说明<input id="description" maxlength="500" placeholder="本单元练习目标（可选）"></label><label for="entries">单词与中文释义（一行一条）</label><p>例如 <code>school 学校</code>、<code>ice cream 冰激凌</code>。支持空格或制表符分隔；支持英文字母、单词间空格和连字符，最长 40 字符；短语建议用制表符分隔释义。只有英文的词条可作为草稿保存。修改或移除下方文本中的整行，即可编辑或移除词条。</p><textarea id="entries" spellcheck="false" placeholder="apple 苹果&#10;banana 香蕉&#10;school 学校" required></textarea><div class="actions"><button type="button" id="preview">校验与预览</button><button id="saveList" disabled>保存词表</button><button type="button" id="newList">新建另一张词表</button></div><div id="importPreview"></div></form></section>
<section><h3>现有词表</h3><p>归档后不再用于新对局，历史成绩和词汇快照继续保留。</p><div id="lists"></div></section></main><script src="library.js"></script></body></html>
